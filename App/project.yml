# Xcode 工程由 XcodeGen 生成：cd App && xcodegen generate
name: OpenBean
options:
  bundleIdPrefix: dev.openbean
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    # 构建号：Sparkle 按它比新旧。每次发布加 1（0.2.0 是 1），只增不减；bin/release 会拦下 appcast 里已有的构建号
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    # 本机自签名证书（Scripts/make-signing-cert.sh）：重新编译后系统权限不会失效
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "openbean local signing"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: arm64
packages:
  openbean:
    path: ..
  # 自动更新（Sparkle 2）。generate_keys / sign_update 在编译后的 SourcePackages/artifacts/sparkle/Sparkle/bin/
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  OpenBean:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbean.app
        PRODUCT_NAME: OpenBean
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../Vendor/sherpa-onnx/lib"
    sources:
      - path: OpenBean
      # 和 iOS 版共用的 App 逻辑（录音库、同步、转写、摘要、日记、设备连接、设置）
      - path: Shared
    dependencies:
      - package: openbean
        product: OpenBeanKit
      - package: openbean
        product: OpenBeanVoice
      # 「今天」的分天函数（DayBoundary），和以后的日记共用
      - package: openbean
        product: OpenBeanLibrary
      # 二进制 xcframework，Xcode 自动拷进 Frameworks 并签名（写 embed: true 反而找不到 Sparkle-product）
      - package: Sparkle
      - framework: ../Vendor/sherpa-onnx/lib/libsherpa-onnx-c-api.dylib
        embed: true
        codeSign: true
      - framework: ../Vendor/sherpa-onnx/lib/libonnxruntime.dylib
        embed: true
        codeSign: true
    info:
      path: OpenBean/Info.plist
      properties:
        CFBundleDisplayName: OpenBean
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSBluetoothAlwaysUsageDescription: OpenBean connects to your soundcore Work recorder to use it as a microphone and to sync recordings.
        NSSpeechRecognitionUsageDescription: OpenBean transcribes your speech on this Mac, offline.
        # openbean://dictate/toggle|start|stop、openbean://sync、openbean://open（快捷指令、Raycast 可用）
        CFBundleURLTypes:
          - CFBundleURLName: dev.openbean.app
            CFBundleURLSchemes: [openbean]
        # 自动更新（Sparkle）：订阅源是仓库 master 上的 appcast.xml，由 bin/release 写入
        SUFeedURL: https://raw.githubusercontent.com/imraywang/openbean/master/appcast.xml
        # EdDSA 公钥；私钥在发布者登录钥匙串里（generate_keys 生成），见 bin/release 开头
        SUPublicEDKey: BjLS2mK2S8UTBjerLJvUbUGQdToKi3/ffYsX/LQp0Kc=
        # 默认就在后台每天检查一次，不再弹「要不要自动检查」的询问
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400

  # iOS 版（OpenBean for iPhone）：录音库、心力模式、录音豆连接和同步、摘要。没有语音输入、MCP、自动更新、菜单栏。
  # 编译：bin/build-ios（模拟器）、bin/build-ios device（真机）
  OpenBeanMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbean.ios
        PRODUCT_NAME: OpenBean
        # iOS 版自己的构建号（版本号沿用上面的 MARKETING_VERSION）
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # 真机用 UPTHOS LLC 的自动签名；模拟器不签名也能装
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ZHPS34Z8M9
        ARCHS: "$(ARCHS_STANDARD)"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Mobile
      - path: Shared
    dependencies:
      - package: openbean
        product: OpenBeanKit
      - package: openbean
        product: OpenBeanVoice
      - package: openbean
        product: OpenBeanLibrary
      # sherpa-onnx 和 onnxruntime 的 iOS 静态 xcframework（Scripts/fetch-deps.sh --ios），静态链接进 App，不用嵌入
      - framework: ../Vendor/sherpa-onnx-ios/sherpa-onnx.xcframework
        embed: false
      - framework: ../Vendor/sherpa-onnx-ios/onnxruntime.xcframework
        embed: false
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDisplayName: OpenBean
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSBluetoothAlwaysUsageDescription: OpenBean connects to your soundcore Work recorder to sync its recordings to this iPhone.
        # 录音豆放回盒子时在后台继续连接、同步（完整的后台同步还没做，见 App/Mobile/BackgroundSync.swift）
        UIBackgroundModes: [bluetooth-central]
        # 大模型服务可以是局域网里的 http 地址（如另一台电脑上的本机模型）
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: OpenBean connects to the LLM service you set in Settings when it runs on your local network.
