# Xcode 工程由 XcodeGen 生成：cd App && xcodegen generate
name: OpenBean
options:
  bundleIdPrefix: dev.openbean
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.1"
    # 构建号：Sparkle 按它比新旧。每次发布加 1（0.2.0 是 1），只增不减；bin/release 会拦下 appcast 里已有的构建号
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    # 本机自签名证书（Scripts/make-signing-cert.sh）：重新编译后系统权限不会失效
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "openbean local signing"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: arm64
packages:
  openbean:
    path: ..
  # 自动更新（Sparkle 2）。generate_keys / sign_update 在编译后的 SourcePackages/artifacts/sparkle/Sparkle/bin/
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  OpenBean:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbean.app
        PRODUCT_NAME: OpenBean
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../Vendor/sherpa-onnx/lib"
    sources:
      - path: OpenBean
    dependencies:
      - package: openbean
        product: OpenBeanKit
      - package: openbean
        product: OpenBeanVoice
      # 二进制 xcframework，Xcode 自动拷进 Frameworks 并签名（写 embed: true 反而找不到 Sparkle-product）
      - package: Sparkle
      - framework: ../Vendor/sherpa-onnx/lib/libsherpa-onnx-c-api.dylib
        embed: true
        codeSign: true
      - framework: ../Vendor/sherpa-onnx/lib/libonnxruntime.dylib
        embed: true
        codeSign: true
    info:
      path: OpenBean/Info.plist
      properties:
        CFBundleDisplayName: OpenBean
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSBluetoothAlwaysUsageDescription: OpenBean connects to your soundcore Work recorder to use it as a microphone and to sync recordings.
        NSSpeechRecognitionUsageDescription: OpenBean transcribes your speech on this Mac, offline.
        # openbean://dictate/toggle|start|stop、openbean://sync、openbean://open（快捷指令、Raycast 可用）
        CFBundleURLTypes:
          - CFBundleURLName: dev.openbean.app
            CFBundleURLSchemes: [openbean]
        # 自动更新（Sparkle）：订阅源是仓库 master 上的 appcast.xml，由 bin/release 写入
        SUFeedURL: https://raw.githubusercontent.com/imraywang/openbean/master/appcast.xml
        # EdDSA 公钥；私钥在发布者登录钥匙串里（generate_keys 生成），见 bin/release 开头
        SUPublicEDKey: BjLS2mK2S8UTBjerLJvUbUGQdToKi3/ffYsX/LQp0Kc=
        # 默认就在后台每天检查一次，不再弹「要不要自动检查」的询问
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
